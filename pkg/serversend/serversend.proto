syntax = "proto3";

package serversend.v1;

option go_package = "github.com/NeoJay0705/gaming-core-casino/pkg/serversend";

import "google/protobuf/empty.proto";
import "pkg/gatelink/gatelink.proto";

// GateDelivery 註冊於 product-level Gate gRPC server，是既有 listener 上的
// generic remote-command ingress；不擁有 listener 或 Gate endpoint lease。
service GateDelivery {
  rpc Forward(gatelink.v1.GateRequest) returns (google.protobuf.Empty);
}

// RedisBroadcastEnvelope 在不改變 generic command 的前提下攜帶 W3C trace
// metadata；inner GateRequest payload 對 transport 保持 opaque。
message RedisBroadcastEnvelope {
  string traceparent = 1;
  gatelink.v1.GateRequest command = 2;
}

// SendPlayersCommand 是 framework 擁有的 batch player delivery routing envelope。
// client_payload 對本 package transport 保持 opaque，只由最終 client-facing
// product code 解碼。
message SendPlayersCommand {
  repeated PlayerDelivery messages = 1;
}

message PlayerDelivery {
  string login_name = 1;
  uint32 client_command_id = 2;
  bytes client_payload = 3;
}
