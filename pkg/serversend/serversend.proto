syntax = "proto3";

package serversend.v1;

option go_package = "github.com/NeoJay0705/gaming-core-casino/pkg/serversend";

import "google/protobuf/empty.proto";
import "pkg/gatelink/gatelink.proto";

// GateDelivery is registered on the product-level Gate gRPC server. It keeps
// exact player delivery and generic remote-command ingress on one listener;
// neither method owns a listener or a Gate endpoint lease.
service GateDelivery {
  rpc SendToPlayer(SendToPlayerRequest) returns (DeliveryResponse);
  rpc Forward(gatelink.v1.GateRequest) returns (google.protobuf.Empty);
}

message SendToPlayerRequest {
  string login_name = 1;
  uint32 command_id = 2;
  bytes payload = 3;
}

enum DeliveryStatus {
  DELIVERY_STATUS_UNSPECIFIED = 0;
  // Gate accepted the message into its local WebSocket delivery path.
  DELIVERY_STATUS_DELIVERED = 1;
  // This Gate has no matching local player session.
  DELIVERY_STATUS_IGNORED = 2;
}

message DeliveryResponse {
  DeliveryStatus status = 1;
  // Single-target delivery returns one when delivered and zero when ignored.
  uint32 delivered_count = 2;
}
