# 共用基礎設施設定；實際服務只會在其 DI graph 使用到資源時才連線。
# 各 product 的 structured log 以 JSON 輸出至 stdout。
logging:
  # 非必要：debug、info、warn、error；預設 info。
  level: info

observability:
  # Health、Readiness 與 Prometheus Metrics 共用的 HTTP listener。
  # Endpoint 固定為 /health、/ready 與 /metrics。
  listen_addr: ":8081"

redis:
  # 必填：single Redis 設定 addr；和 addrs 只能擇一。
  addr: "redis:6379"

  # 必填：整個 application 共用的 Redis root namespace；各 subsystem 會
  # 在此後面附加固定 segment。
  key_prefix: "core-casino"

  # Cluster Redis 改用 addrs，並移除上方 addr。
  # addrs:
  #   - "redis-0:6379"
  #   - "redis-1:6379"
  #   - "redis-2:6379"

  # 非必要：Redis ACL 使用者與密碼；請透過部署環境覆蓋敏感值。
  # username: ""
  # password: ""

  # 非必要：single mode 的 logical DB，預設 0；cluster mode 固定只能是 0。
  # db: 0

  # 非必要：go-redis connection pool 設定。
  # pool_size: 100
  # min_idle_conns: 10
  # max_idle_conns: 20
  # pool_timeout: "4s"
  # dial_timeout: "5s"
  # read_timeout: "5s"
  # write_timeout: "5s"
  # conn_max_idle_time: "5m"
  # conn_max_lifetime: "30m"

database:
  # 必填：MySQL/TiDB DSN；請透過部署環境覆蓋帳密。
  dsn: "app:change-me@tcp(tidb:4000)/gaming?charset=utf8mb4&parseTime=true&loc=UTC"

  # 非必要：database/sql connection pool 設定。
  # max_open_conns: 100
  # max_idle_conns: 10
  # conn_max_lifetime: "30m"
  # conn_max_idle_time: "5m"

rocketmq:
  # 必填：RocketMQ 4 nameserver；可用逗號或分號指定多個 host:port。
  endpoint: "rocketmq-namesrv:9876"

  # 非必要：預設不 retry；只有 consumer 已實作冪等處理時才可提高。
  # producer_retry_times: 0

  # 非必要：RocketMQ namespace 與 ACL；請透過部署環境覆蓋敏感值。
  # namespace: ""
  # access_key: ""
  # secret_key: ""

local_mq:
  # 必填：已由 maintenance bootstrap 建立的 RWX durable root。
  root_path: "/var/lib/gaming-core/local-mq"

  # 必填：同一個 RWX storage root 的 immutable identity，必須是 UUIDv7。
  storage_id: "01993e11-8d3a-7c8f-a7ce-2ab21df8d410"

  # bytes/records；root control 建立後不可由 pod 設定靜默覆寫。
  publish_queue_capacity: 4096
  group_commit_max_messages: 256
  group_commit_max_bytes: 1048576
  group_commit_max_wait: "2ms"
  segment_max_bytes: 134217728
  segment_max_age: "1h"
  producer_stop_free_bytes: 1073741824
  recovery_reserve_bytes: 536870912
  max_clock_skew: "1s"

  consumer:
    heartbeat_interval: "3s"
    membership_timeout: "15s"
    reconcile_interval: "5s"
    worker_concurrency: 8
    batch_max_messages: 500
    batch_max_bytes: 4194304
    batch_max_wait: "10ms"
    handler_timeout: "30s"
    checkpoint_max_records: 5000
    checkpoint_max_delay: "100ms"
