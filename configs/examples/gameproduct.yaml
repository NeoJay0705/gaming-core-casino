# Production structured log 以 JSON 輸出至 stdout，再由 collector 送往指定的
# log backend。
logging:
  # 非必要：debug、info、warn、error；預設 info。
  level: info

# Game product 的單一 product-level gRPC server。
grpc:
  server:
    # 必填：Game product 唯一 gRPC listener。
    listen_addr: ":9090"
    # 非必要：每條 HTTP/2 connection 的 concurrent streams；0 使用 grpc-go default，預設 0。
    # max_concurrent_streams: 0
    # 非必要：experimental reusable stream workers；0 保留 grpc-go default，且不限制 RPC concurrency。
    # stream_workers: 0
    # 非必要：每條 Game gRPC connection 的 write buffer bytes；0 保留 grpc-go default。
    # write_buffer_size_bytes: 0

  # Game 透過 Redis presence／endpoint directory 找到指定 Gate；此 client
  # 只設定每次 delivery 的 timeout，不設定固定 target。
  clients:
    gate:
      # 非必要：exact／fan-out Gate RPC timeout；預設 3s。
      # timeout: "3s"
      fanout:
        # 必填（使用 PlayerSender 或 broadcast 時）：all-Gate fan-out 的 headless DNS target。
        target: "dns:///gate-grpc-headless:9091"
        # 非必要：最多 fan-out endpoint；預設 256。
        # max_endpoints: 256

server_send:
  player: {}
    # 非必要：省略時使用 queue_capacity_messages=10000。
    # queue_capacity_messages: 10000
    # 非必要：省略時使用 queue_capacity_bytes=64MiB。
    # queue_capacity_bytes: 67108864
    # 非必要：Player worker 每輪最多處理的訊息數；省略時使用 10000。
    # batch_max_messages: 10000
    # 非必要：Player worker 每輪最多處理的 encoded bytes；省略時使用 8MiB。
    # batch_max_bytes: 8388608
  broadcast:
    # 非必要：redis 或 grpc；預設 redis；Redis publish／subscriber 失敗時 fallback gRPC。
    primary: redis
    # 非必要：Broadcast outer command queue；省略時使用 10000。
    # queue_capacity_messages: 10000
    # 非必要：Broadcast outer command queue bytes；省略時使用 64MiB。
    # queue_capacity_bytes: 67108864
