# Gate player WebSocket transport.
websocket:
  # 必填：Gate 對玩家提供 WebSocket 的監聽位址。
  client_addr: ":8082"

  # 非必要：每條連線等待 writer 處理的 binary packet 數量；預設 256。
  # write_chan_size: 256

  # 非必要：單一 binary frame 寫入逾時（毫秒）；預設 5000。
  # write_timeout_ms: 5000

# 必填：Gate 轉送玩家 binary request 到 Game 的 gRPC client。
# 應使用可解析多個 Game instance 的 target；client 預設 round_robin。
gate_to_game:
  target: "dns:///gameproduct:9090"

  # 非必要：單次轉送 deadline；預設 10s。
  # timeout: "10s"

# Game → Gate 的 Server Send receiver；請和 infra.yaml 的 server_send 合併載入。
server_send:
  presence:
    # 必填：Gate session owner lease；較長 TTL 降低大量在線玩家的 renew write volume。
    lease_ttl: "5m"

  gate:
    # 必填：接收 Game server-send gRPC 的監聽位址。
    listen_addr: ":9091"

    # 必填：Gate endpoint Redis lease TTL。
    endpoint_ttl: "30s"
    # 非必要：續租間隔；預設 endpoint_ttl/3。
    # endpoint_refresh: "10s"
