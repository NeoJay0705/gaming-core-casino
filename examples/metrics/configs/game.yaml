logging:
  # 非必要：debug、info、warn、error；預設 info。
  level: info

observability:
  # 必填：/health、/ready、/metrics 共用的 HTTP listener。
  listen_addr: "127.0.0.1:19080"
  # 非必要：loopback-only production pprof listener；空白代表關閉（default）。
  pprof_listen_addr: ""

grpc:
  server:
    # 必填：Game product 唯一 gRPC listener。
    listen_addr: "127.0.0.1:19090"
    # 非必要：每條 HTTP/2 connection 的 concurrent streams；0 使用 grpc-go default（default）。
    # max_concurrent_streams: 0
    # 非必要：每條 Game gRPC connection 的 write buffer bytes；0 保留 grpc-go default。
    # write_buffer_size_bytes: 0
  clients:
    gate:
      # 非必要：broadcast／player gRPC RPC timeout；預設 3s。
      timeout: "5s"
      fanout:
        # 必填：broadcast fallback 與 player fallback 的 headless DNS target。
        target: "dns:///gate-grpc-headless:19091"
        # 非必要：最多 fan-out endpoint；0 使用 default 256。
        max_endpoints: 256

server_send:
  player: {}
    # 非必要：省略時使用 queue_capacity_messages=10000。
    # queue_capacity_messages: 10000
    # 非必要：省略時使用 queue_capacity_bytes=64MiB。
    # queue_capacity_bytes: 67108864
    # 非必要：Player worker 每輪最多處理的訊息數；省略時使用 10000。
    # batch_max_messages: 10000
    # 非必要：Player worker 每輪最多處理的 encoded bytes；省略時使用 8MiB。
    # batch_max_bytes: 8388608
  broadcast:
    # 非必要：redis 或 grpc；default redis；Redis publish／subscriber 失敗時 fallback gRPC。
    primary: "redis"
    # 非必要：Broadcast outer command queue；省略時使用 10000。
    # queue_capacity_messages: 10000
    # 非必要：Broadcast outer command queue bytes；省略時使用 64MiB。
    # queue_capacity_bytes: 67108864

redis:
  # 必填：Redis server address。
  addr: "127.0.0.1:6379"
  # 必填：application Redis root namespace。
  key_prefix: "metrics-example"
